# CD do ambiente de desenvolvimento: todo push na `dev` (merge de PR ou commit direto) roda o CI completo e, se passar,
# publica no servidor local (cintraserver, acessível pela tailnet em https://cintraserver.taile04221.ts.net).
# O deploy roda num runner self-hosted (label `finah-dev`) instalado no próprio servidor: stack, banco e .env em /opt/finah-dev.
# A produção (VPS) só muda pelo deploy.yml (push na `main`).
name: Deploy dev

on:
  push:
    branches: [dev]
  workflow_dispatch: # redeploy manual da dev

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Publicar em dev
    needs: ci
    runs-on: [self-hosted, finah-dev]
    timeout-minutes: 25
    environment:
      name: development
      url: https://cintraserver.taile04221.ts.net
    env:
      APP_DIR: /opt/finah-dev
      COMPOSE: docker compose -p finah-dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Guarda a imagem atual (para voltar atrás)
        run: docker image inspect finah-dev:local >/dev/null 2>&1 && docker tag finah-dev:local finah-dev:previous || echo 'sem imagem anterior'

      - name: Copia o código
        # O .env e os backups são só do servidor.
        run: |
          rsync -a --delete \
            --include '.env.example' --exclude '.git/' --exclude '.github/' --exclude 'node_modules/' \
            --exclude '.next/' --exclude '.env' --exclude '.env.*' \
            --exclude '/backups/' --exclude '/docker/backup/rclone/' \
            ./ "$APP_DIR/"

      - name: Build e restart (as migrações rodam antes do app)
        run: cd "$APP_DIR" && $COMPOSE up -d --build --remove-orphans

      - name: Espera o app responder
        run: |
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 http://127.0.0.1:3001/api/health || true)
            echo "tentativa $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 5
          done
          echo "O app não ficou saudável a tempo."
          exit 1

      - name: Conferência final (login no ar, containers saudáveis)
        run: |
          curl -fsS --max-time 15 http://127.0.0.1:3001/login | grep -q Finah
          cd "$APP_DIR" && $COMPOSE ps --format '{{.Name}} {{.Status}}'

      - name: Volta para a versão anterior se algo falhou
        if: failure()
        run: |
          echo "::error::Deploy em dev falhou: voltando para a imagem anterior."
          cd "$APP_DIR" && $COMPOSE logs --tail=60 app migrate || true
          if docker image inspect finah-dev:previous >/dev/null 2>&1; then
            docker tag finah-dev:previous finah-dev:local
            cd "$APP_DIR" && $COMPOSE up -d --no-build
          else
            echo 'sem imagem anterior para restaurar'
          fi
